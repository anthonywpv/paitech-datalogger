plugins {
    id 'com.android.application'
}

// Lee credenciales desde local.properties (fuera del control de versiones)
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localProps.load(new FileInputStream(localFile))
}

android {
    namespace 'ec.edu.espol.paipay.datalogger'
    compileSdk 35

    defaultConfig {
        applicationId "ec.edu.espol.paipay.datalogger"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Credenciales inyectadas desde local.properties: no quedan en el código fuente.
        buildConfigField "String", "NEON_DATA_API_URL",
                "\"${localProps.getProperty('NEON_DATA_API_URL', 'https://CONFIGURA-TU-ENDPOINT.apirest.neon.tech/neondb/rest/v1/')}\""
        buildConfigField "String", "NEON_AUTH_URL",
                "\"${localProps.getProperty('NEON_AUTH_URL', 'https://CONFIGURA-TU-ENDPOINT.neonauth.neon.tech/neondb/auth/')}\""
        buildConfigField "String", "NEON_ORIGIN",
                "\"${localProps.getProperty('NEON_ORIGIN', 'https://paipay.espol.edu.ec')}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        // MigrationTestHelper lee los esquemas exportados desde los assets del
        // APK de pruebas: es lo que le permite validar que la migración deja la
        // base exactamente como Room la espera.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    // Room - base de datos local (sincronización diferida)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit - consumo de Neon Data API (REST sobre Postgres)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Sesión persistente cifrada
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Sincronización en segundo plano al recuperar conexión
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // Prueba de la migración de la base local sobre un dispositivo real.
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
